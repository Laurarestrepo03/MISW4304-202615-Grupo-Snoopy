services:
  db:
    image: postgres:16
    container_name: blacklist-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blacklist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - blacklist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacklist"]
      interval: 5s
      timeout: 5s
      retries: 10

  blacklist-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blacklist-app
    restart: unless-stopped
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:5000",
        "--workers",
        "1",
        "--reload",
        "app:app",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/blacklist
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-me-32-bytes-min}
      ENABLE_RESET: "true"
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-5000}:5000"
    networks:
      - blacklist-network
    depends_on:
      db:
        condition: service_healthy

networks:
  blacklist-network:

volumes:
  pgdata:
