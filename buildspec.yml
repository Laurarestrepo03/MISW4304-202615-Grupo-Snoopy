version: 0.2

env:
  variables:
    # Datos del repositorio ECR (ver "Comandos de envío" en la consola de ECR)
    AWS_ACCOUNT_ID: "010724906952"
    AWS_REGION: "us-east-1"
    ECR_REPOSITORY: "blacklist-app"
    CONTAINER_PORT: "5000"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo Running unit tests...
      - pytest --cov=resources --cov=app --cov-report=term-missing
      - echo Logging in to Amazon ECR...
      - REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPOSITORY_URI=$REGISTRY/$ECR_REPOSITORY
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY

  build:
    commands:
      - echo Build started on `date`
      - docker build -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing Dockerrun.aws.json for Elastic Beanstalk...
      - printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s","Update":"true"},"Ports":[{"ContainerPort":%s}]}' "$REPOSITORY_URI:$IMAGE_TAG" "$CONTAINER_PORT" > Dockerrun.aws.json
      - cat Dockerrun.aws.json
      - echo Build completed on `date`

artifacts:
  files:
    - Dockerrun.aws.json

    